<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mis Rutas - Raíces Digitales</title>
    <!-- ====== FAVICON ====== -->
    <link rel="icon" type="image/x-icon" href="favico.ico" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <style>
        /* ============================================
           ESTILOS ESPECÍFICOS DE RUTAS DE APRENDIZAJE
        ============================================ */
        .learning-page {
            padding: 40px 0 60px;
            background: var(--color-background);
            min-height: calc(100vh - 140px);
        }

        .learning-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 32px;
        }

        .learning-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
        }

        .learning-header h1 span {
            color: var(--color-primary);
        }

        .learning-header .level-badge {
            display: inline-block;
            padding: 6px 20px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .level-badge.basico {
            background: #FFF3E0;
            color: #E65100;
        }

        .level-badge.intermedio {
            background: #E3F2FD;
            color: #0D47A1;
        }

        .level-badge.avanzado {
            background: #E8F5E9;
            color: #1B5E20;
        }

        .level-badge.sin-evaluar {
            background: #F5F5F5;
            color: #757575;
        }

        /* Filtros de módulos */
        .filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        .filter-btn {
            padding: 8px 20px;
            border: 2px solid var(--color-border);
            border-radius: 50px;
            background: var(--color-white);
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9rem;
            transition: var(--transition);
            font-family: var(--font-primary);
        }

        .filter-btn:hover {
            border-color: var(--color-primary-light);
        }

        .filter-btn.active {
            border-color: var(--color-primary);
            background: var(--color-primary);
            color: var(--color-white);
        }

        /* Grid de módulos */
        .modules-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 24px;
        }

        .module-card {
            background: var(--color-white);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: 0 2px 12px var(--color-shadow);
            border: 1px solid var(--color-border);
            transition: var(--transition);
            position: relative;
        }

        .module-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px var(--color-shadow);
        }

        .module-card.completed {
            border-left: 4px solid #2D8B4E;
            background: #F8FCF9;
        }

        .module-card .module-badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .module-badge.information {
            background: #E3F2FD;
            color: #0D47A1;
        }

        .module-badge.communication {
            background: #E8F5E9;
            color: #1B5E20;
        }

        .module-badge.content {
            background: #FFF3E0;
            color: #E65100;
        }

        .module-badge.security {
            background: #FCE4EC;
            color: #880E4F;
        }

        .module-badge.problemSolving {
            background: #F3E5F5;
            color: #4A148C;
        }

        .module-card h3 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .module-card .module-desc {
            color: var(--color-text-light);
            font-size: 0.95rem;
            margin-bottom: 12px;
        }

        .module-card .module-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--color-text-light);
            padding-top: 12px;
            border-top: 1px solid var(--color-border);
        }

        .module-card .module-meta .difficulty {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .module-card .module-meta .difficulty .star {
            color: #F0AD4E;
        }

        .module-card .module-meta .difficulty .star.empty {
            color: var(--color-border);
        }

        .module-card .module-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
        }

        .module-status.completed {
            color: #2D8B4E;
        }

        .module-status.pending {
            color: var(--color-text-light);
        }

        .module-status.in-progress {
            color: #F0AD4E;
        }

        .module-card .btn {
            width: 100%;
            justify-content: center;
            margin-top: 16px;
        }

        /* Modal / Detalle del módulo */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.open {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        .modal-content {
            background: var(--color-white);
            border-radius: var(--radius-lg);
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 40px;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.2);
            position: relative;
        }

        .modal-content .modal-close {
            position: absolute;
            top: 16px;
            right: 20px;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--color-text-light);
            transition: var(--transition);
        }

        .modal-content .modal-close:hover {
            color: var(--color-text);
            transform: rotate(90deg);
        }

        .modal-content .modal-badge {
            display: inline-block;
            padding: 4px 16px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .modal-content h2 {
            font-size: 1.5rem;
            margin-bottom: 8px;
        }

        .modal-content .modal-desc {
            color: var(--color-text-light);
            margin-bottom: 16px;
            line-height: 1.6;
        }

        .modal-content .modal-content-body {
            background: var(--color-background);
            padding: 20px;
            border-radius: var(--radius);
            margin: 16px 0;
            line-height: 1.8;
        }

        .modal-content .modal-content-body ul {
            padding-left: 20px;
        }

        .modal-content .modal-content-body li {
            margin-bottom: 6px;
        }

        .modal-content .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .modal-content .modal-actions .btn {
            flex: 1;
            min-width: 120px;
            justify-content: center;
        }

        /* Estado sin diagnóstico */
        .no-diagnostic {
            text-align: center;
            padding: 60px 20px;
            background: var(--color-white);
            border-radius: var(--radius-lg);
            border: 1px solid var(--color-border);
        }

        .no-diagnostic i {
            font-size: 4rem;
            color: var(--color-border);
            margin-bottom: 16px;
        }

        .no-diagnostic h3 {
            font-size: 1.3rem;
            margin-bottom: 8px;
        }

        .no-diagnostic p {
            color: var(--color-text-light);
            max-width: 400px;
            margin: 0 auto 20px;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .modules-grid {
                grid-template-columns: 1fr;
            }

            .modal-content {
                padding: 24px 20px;
            }

            .learning-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .filters {
                justify-content: center;
            }

            .filter-btn {
                padding: 6px 14px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-custom" style="padding: 0 !important; min-height: auto !important; overflow: visible !important;">
        <div class="nav-container" style="height: 83px; padding: 0 16px; overflow: visible !important; position: relative;">
            <div class="nav-brand logo-container" style="display: flex; align-items: center; height: 150%; overflow: visible !important;">
            <img src="assets/img/logo-raices.png" alt="Raíces Digitales" class="logo-img" style="height: 120px; width: auto; z-index: 10; display: block;" />
            <span style="font-size: 1.2rem; line-height: 1; font-weight: 700; margin-left: 6px;">Raíces Digitales</span>
        </div>
            <div class="nav-links">
                <!-- Se carga dinámicamente con app.js -->
            </div>
            <button class="nav-toggle" id="navToggle">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </nav>

    <section class="learning-page">
        <div class="container">
            <!-- Header -->
            <div class="learning-header">
                <div>
                    <h1>🛣️ Mis <span>rutas de aprendizaje</span></h1>
                    <p style="color:var(--color-text-light);font-size:0.95rem;">
                        Contenido personalizado según tu nivel de competencias digitales
                    </p>
                </div>
                <div id="levelBadgeContainer">
                    <!-- Se llena dinámicamente -->
                </div>
            </div>

            <!-- Filtros -->
            <div class="filters" id="filtersContainer">
                <button class="filter-btn active" data-filter="all">Todos</button>
                <button class="filter-btn" data-filter="information">Información</button>
                <button class="filter-btn" data-filter="communication">Comunicación</button>
                <button class="filter-btn" data-filter="content">Contenido</button>
                <button class="filter-btn" data-filter="security">Seguridad</button>
                <button class="filter-btn" data-filter="problemSolving">Problemas</button>
            </div>

            <!-- Contenedor de módulos -->
            <div id="modulesContainer">
                <!-- Se llena dinámicamente con JS -->
            </div>
        </div>
    </section>

    <!-- Modal de detalle del módulo -->
    <div class="modal-overlay" id="moduleModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">
                <i class="fas fa-times"></i>
            </button>
            <div id="modalBody">
                <!-- Se llena dinámicamente con JS -->
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 Raíces Digitales - Proyecto de Grado UNAD</p>
            </div>
        </div>
    </footer>

    <script src="assets/js/utils.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/learning.js"></script>
</body>
</html>
