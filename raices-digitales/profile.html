<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi Perfil - Raíces Digitales</title>
    <!-- ====== FAVICON ====== -->
    <link rel="icon" type="image/x-icon" href="favico.ico" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <style>
        .profile-page {
            padding: 40px 0 60px;
            background: var(--color-background);
            min-height: calc(100vh - 140px);
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 30px;
            background: var(--color-white);
            padding: 32px 40px;
            border-radius: var(--radius-lg);
            box-shadow: 0 2px 12px var(--color-shadow);
            border: 1px solid var(--color-border);
            margin-bottom: 32px;
            flex-wrap: wrap;
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: var(--color-primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .profile-info h1 {
            font-size: 1.8rem;
            margin-bottom: 4px;
        }

        .profile-info .email {
            color: var(--color-text-light);
            font-size: 1rem;
        }

        .profile-info .meta {
            display: flex;
            gap: 20px;
            margin-top: 8px;
            flex-wrap: wrap;
            font-size: 0.9rem;
            color: var(--color-text-light);
        }

        .profile-info .meta span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .profile-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        .profile-card {
            background: var(--color-white);
            padding: 24px;
            border-radius: var(--radius);
            box-shadow: 0 2px 12px var(--color-shadow);
            border: 1px solid var(--color-border);
        }

        .profile-card .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .profile-card .card-title i {
            color: var(--color-primary);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 4px;
        }

        .form-group input {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid var(--color-border);
            border-radius: var(--radius);
            font-size: 1rem;
            transition: var(--transition);
            font-family: var(--font-primary);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 4px rgba(45, 106, 79, 0.1);
        }

        .form-group input:disabled {
            background: var(--color-background);
            cursor: not-allowed;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--color-border);
            font-size: 0.95rem;
        }

        .stat-item:last-child {
            border-bottom: none;
        }

        .stat-item .label {
            color: var(--color-text-light);
        }

        .stat-item .value {
            font-weight: 600;
        }

        .stat-item .value.completed {
            color: #2D8B4E;
        }

        .stat-item .value.pending {
            color: #F0AD4E;
        }

        .btn-danger-outline {
            background: transparent;
            color: #D9534F;
            border: 2px solid #D9534F;
        }

        .btn-danger-outline:hover {
            background: #D9534F;
            color: white;
            transform: translateY(-2px);
        }

        .btn-export {
            background: transparent;
            color: var(--color-primary);
            border: 2px solid var(--color-primary);
        }

        .btn-export:hover {
            background: var(--color-primary);
            color: white;
            transform: translateY(-2px);
        }

        .profile-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        @media (max-width: 768px) {
            .profile-grid {
                grid-template-columns: 1fr;
            }

            .profile-header {
                flex-direction: column;
                text-align: center;
                padding: 24px 20px;
            }

            .profile-info .meta {
                justify-content: center;
            }

            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-custom" style="padding: 0 !important; min-height: auto !important; overflow: visible !important;">
        <div class="nav-container" style="height: 83px; padding: 0 16px; overflow: visible !important; position: relative;">
            <div class="nav-brand logo-container" style="display: flex; align-items: center; height: 150%; overflow: visible !important;">
            <img src="assets/img/logo-raices.png" alt="Raíces Digitales" class="logo-img" style="height: 120px; width: auto; z-index: 10; display: block;" />
            <span style="font-size: 1.2rem; line-height: 1; font-weight: 700; margin-left: 6px;">Raíces Digitales</span>
        </div>
            <div class="nav-links">
                <!-- Se carga dinámicamente con app.js -->
            </div>
            <button class="nav-toggle" id="navToggle">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </nav>

    <section class="profile-page">
        <div class="container">
            <!-- Header del perfil -->
            <div class="profile-header" id="profileHeader">
                <!-- Se llena dinámicamente -->
            </div>

            <!-- Grid de perfil -->
            <div class="profile-grid">
                <!-- Información personal -->
                <div class="profile-card">
                    <div class="card-title">
                        <i class="fas fa-user-edit"></i>
                        Información personal
                    </div>
                    <form id="profileForm">
                        <div class="form-group">
                            <label for="profileName"><i class="fas fa-user"></i> Nombre completo</label>
                            <input type="text" id="profileName" />
                        </div>
                        <div class="form-group">
                            <label for="profileEmail"><i class="fas fa-envelope"></i> Correo electrónico</label>
                            <input type="email" id="profileEmail" disabled />
                        </div>
                        <div class="form-group">
                            <label for="profilePassword"><i class="fas fa-lock"></i> Nueva contraseña (opcional)</label>
                            <input type="password" id="profilePassword" placeholder="Dejar en blanco para no cambiar" />
                        </div>
                        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">
                            <i class="fas fa-save"></i> Actualizar perfil
                        </button>
                    </form>
                </div>

                <!-- Estadísticas y datos -->
                <div class="profile-card">
                    <div class="card-title">
                        <i class="fas fa-chart-pie"></i>
                        Estadísticas de aprendizaje
                    </div>
                    <div id="profileStats">
                        <!-- Se llena dinámicamente -->
                    </div>

                    <div style="margin-top:20px;padding-top:20px;border-top:1px solid var(--color-border);">
                        <div class="card-title" style="margin-bottom:12px;">
                            <i class="fas fa-tools"></i>
                            Acciones
                        </div>
                        <div class="profile-actions">
                            <button class="btn btn-export btn-sm" onclick="exportData()">
                                <i class="fas fa-download"></i> Exportar datos
                            </button>
                            <button class="btn btn-danger-outline btn-sm" onclick="deleteAccount()">
                                <i class="fas fa-trash-alt"></i> Eliminar cuenta
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 Raíces Digitales - Proyecto de Grado UNAD</p>
            </div>
        </div>
    </footer>

    <script src="assets/js/utils.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/profile.js"></script>
</body>
</html>
